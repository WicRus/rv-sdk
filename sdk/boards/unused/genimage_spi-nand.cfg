image userdata.ubifs {
  ubifs {}
  size = 128M
}
image misc.img {
  custom {
    exec = "dd if=/dev/zero of=$IMAGEOUTFILE bs=1K count=48"
  }
  size = 48K
}

image spi-nand.img {
  hdimage {
    partition-table-type = "gpt"
  }

  partition idblock {
    in-partition-table = "no"
    image = "idblock.bin"
    offset = 0x008000
  }

  partition vnvm {
    image = "misc.img"
    offset = 0x0E0000
  }

  partition uboot {
    partition-type-uuid = U
    image = "uboot.img"
    offset = 0x800000
  }

  partition boot {
    partition-type-uuid = U
    image = "kernel.img"
    offset = 0x500000
  }

  partition misc {
    image = "misc.img"
  }

  partition rootfs {
    image = "rootfs.squashfsubi"
    partition-uuid = 614e0000-0000-4b53-8000-1d28000054a9
  }

  partition userdata {
    image = "userdata.ubifs"
  }
}
