image userdata.ext4 {
    ext4 {}
    size = 10M
}
image misc.img {
  custom {
    exec = "dd if=/dev/zero of=$IMAGEOUTFILE bs=1K count=48"
  }
  size = 48K
}

image sdcard.img {

  hdimage {
    partition-table-type = "gpt"
  }

  partition idblock {
    in-partition-table = "no"
    image = "idblock.bin"
    offset = 0x8000
  }

  partition uboot {
    partition-type-uuid = U
    image = "uboot.img"
    offset = 0x800000
  }

  partition boot {
    partition-type-uuid = U
    image = "kernel.img"
    offset = 0x01000000
  }

  partition misc {
    image = "misc.img"
  }

  partition rootfs {
    image = "rootfs.ext4"
    partition-uuid = 614e0000-0000-4b53-8000-1d28000054a9
  }

  partition userdata {
    image = "userdata.ext4"
  }

}

